rega del producto. Definitivamente seguire comprando aqui mis proximos equipos.","El buscador no reconoce bien los sinonimos, tuve que probar varias palabras distintas para encontrar lo que buscaba. Deberian mejorar el motor de busqueda interno.","Muy buena experiencia de compra desde el celular, todo el flujo es intuitivo.","La variedad de categorias es buena aunque siento que podria ampliarse un poco mas en accesorios.","Las ofertas son interesantes aunque no siempre coinciden con lo que estoy buscando en el momento.","El buscador reconoce bien aunque escriba el nombre del producto con errores.","La confirmacion de pedido llega de inmediato al correo con todos los detalles.","Compre por primera vez y quede muy conforme con todo el proceso de principio a fin.","Me parece justo el precio de envio comparado con otras tiendas de electronica.","El soporte me oriento bien sobre compatibilidad de accesorios con mi equipo.","La comparacion de especificaciones tecnicas me ayudo muchisimo a elegir entre dos laptops similares. Es justo el tipo de informacion que uno busca antes de invertir en tecnologia.","El proceso de cambio de producto por otro modelo fue mas lento de lo esperado.","Las descripciones de producto son suficientes aunque podrian incluir mas fotos desde distintos angulos.",null],"marker":{"color":"#CFD8DC","opacity":0.5,"size":5},"mode":"markers+text","name":"other","showlegend":false,"x":{"dtype":"f4","bdata":"gDR9wFPu\u002fr\u002fJoVPAhxBRwLLFF8CegWjAWJpkwHLStL+cHTjAtmpTwFkTeMAGGQbAog1Sv+8mU8BG03PAmv0awPo9bsDCiFHA6TV0wPjNxb+q8QfAi9YfwCLAaMAIxnDAk1hVwCb4fMDAND\u002fA"},"y":{"dtype":"f4","bdata":"HRvpQO8BREALQghBOzGBQOdT6EBcRANBcc0FQQrzZ0BxottAnKCjQFvY2EBZcPBACDpsQCVe\u002f0DnyK1AzBUGQSn900A9C9FAIk6vQEH81EBTueZAYPkDQe2NAEF5wgFBdOCCQN4o1UBX69BA"},"type":"scattergl"},{"hoverinfo":"text","hovertext":["El formulario de contacto no envio mi mensaje la primera vez y tuve que intentarlo tres veces distintas.","El servicio de asistencia por correo respondio con una plantilla generica que no resolvia mi problema especifico.","El sitio me cerro sesion a mitad del pago y perdi el carrito completo que habia armado. Tuve que rehacer todo el pedido desde cero.","El sitio se desconecto varias veces durante el checkout un dia de alta demanda, tuve que reiniciar el proceso completo.","Un vendedor de soporte me dio informacion incorrecta sobre un plazo de entrega y tuve que reprogramar mis planes.","El chat de soporte demoro mas de media hora en responder un dia de alta demanda.","El chat en vivo estuvo caido todo un fin de semana sin ningun aviso previo. Tuve que esperar hasta el lunes para resolver mi consulta.","El correo de bienvenida ofrecia un descuento que nunca pude aplicar en el checkout. Escribi a soporte pero no me dieron una explicacion clara.","El servicio al cliente respondio mis dudas por chat en menos de cinco minutos.","El proceso de verificacion en dos pasos fallo varias veces y bloqueo temporalmente mi cuenta.","El envio se retraso mas de lo que indicaba el seguimiento del pedido.","Me cobraron dos veces por error y tuve que esperar varios dias para que me reembolsaran.","Recibi spam de terceros despues de registrarme, sospecho que compartieron mi correo con algun socio comercial.","Intente actualizar mi metodo de pago y el sistema me mostro un error generico sin mas detalles.","El tiempo de respuesta por WhatsApp fue mejor que por correo electronico.","Pedi una factura por RUC y me la enviaron con datos incorrectos dos veces seguidas. Recien a la tercera solicitud lograron corregirla bien.","Mi cupon de bienvenida expiro antes de poder usarlo, la vigencia era demasiado corta para el tramite que exigian.","Recibi un correo de confirmacion pero el pedido nunca aparecio en mi historial de compras. Tuve que llamar por telefono para confirmar que si se habia procesado.","El envio internacional tardo mas dias de los indicados originalmente.","Cancele mi cuenta y me siguieron llegando correos promocionales durante semanas. Tuve que darme de baja manualmente de cada lista.","El proceso de creacion de cuenta pide verificar el correo pero el enlace tardo en llegar.","Pedi eliminar mis datos personales segun la politica de privacidad y el proceso tardo mas de un mes en completarse.","El chat de soporte me transfirio tres veces a distintos agentes y tuve que repetir mi problema cada vez. Terminaron resolviendolo pero la experiencia fue frustrante.","El tiempo de espera del chat de soporte fue bastante largo un fin de semana. Entiendo que hay menos personal pero deberian avisar el tiempo estimado de espera.","El tiempo de respuesta del correo de soporte es aceptable, normalmente en menos de 24 horas.","Cancele un pedido y el reembolso tardo mas de diez dias habiles en aparecer en mi tarjeta. El soporte solo repetia que estaba en proceso sin dar una fecha concreta.","Tuve problemas para aplicar un cupon de descuento durante el checkout.","El tiempo de espera en la linea telefonica de soporte supero los veinte minutos en horario de oficina.","Intente hacer una devolucion y el proceso fue confuso, nadie me explico bien los pasos.","El sitio se cayo un momento durante una oferta especial, tuve que reintentar la compra.","La factura electronica llego con datos incorrectos y tuve que pedir que la corrigieran.","Me cobraron el envio dos veces por un error del sistema y tuve que escribir tres correos distintos para que me lo revirtieran. La solucion tardo mas de una semana en llegar.","El seguimiento del pedido no siempre se actualiza en tiempo real, a veces se queda igual por dos dias. Al final el paquete llego bien pero la informacion no era precisa.","El sistema de puntos se reinicio sin explicacion despues de una actualizacion de la plataforma. Perdi el saldo acumulado de varios meses."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"0_soporte_correo_chat","text":["","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","","",""],"textfont":{" \u002fuK\u002fTiMqwISG879M1fO\u002fpZwtwA=="},"y":{"dtype":"f4","bdata":"Iz\u002f6QKdY+0D95vpA4nzkQMnY\u002fkDpr\u002ftA+Bn7QA2ZAEH3lPhAvSz2QIhK9UA+FP9AA\u002fj3QA=="},"type":"scattergl"},{"hoverinfo":"text","hovertext":["Muy buena atencion personalizada cuando pregunte por disponibilidad de un modelo agotado.","El sitio funciona bien en general aunque algunas paginas tardan un poco mas de lo esperado en cargar.","Buena experiencia usando el asistente virtual para resolver dudas rapidas sobre garantia. Respondio en segundos y no tuve que esperar a un agente humano.","El diseno del sitio en modo oscuro tiene algunos textos dificiles de leer.","El sitio no guarda bien las preferencias de idioma y cada vez que entro tengo que cambiarlo de nuevo.","Buena experiencia general, aunque el sitio podria cargar mas rapido en horas pico.","Muy buena atencion cuando llame para preguntar sobre garantia extendida.","El proceso de canje de puntos podria explicarse mejor en la pagina de ayuda.","Muy buena experiencia usando el asistente virtual del sitio para resolver dudas rapidas.","El sitio funciona bien en general pero el checkout como invitado a veces pide iniciar sesion de todas formas. Es un detalle menor pero confunde un poco.","La pagina es muy facil de navegar, encontre lo que buscaba en pocos minutos.","El diseno del sitio es agradable pero en modo oscuro algunos textos son dificiles de leer. Pequenos ajustes de contraste mejorarian mucho la experiencia."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"2_sitio_buena_experiencia","text":["","","","","","","","","","","",""],"textfont":{"size":12},"x":{"dtype":"f4","bdata":"2idCwFDD57+ADCnAu44CwOJpA8AbfMm\u002fSj5DwH8ILcCrqiPAPJb0v2GNAsBcQQDA"},"y":{"dtype":"f4","bdata":"PzWyQP7Fo0AsXrBACXWkQKHPo0B9r6RAwP2tQI9jwEAwNrNAyLqcQO0asECc46hA"},"type":"scattergl"},{"hoverinfo":"text","hovertext":["Compre un producto marcado como disponible y luego me avisaron que no habia stock.","Excelente variedad de marcas, encontre opciones que no tenia en otras tiendas.","El stock mostrado no siempre esta actualizado, un producto que queria ya no estaba disponible.","Las recomendaciones de productos no tienen mucho sentido con lo que realmente compro, parecen genericas.","La busqueda de productos podria mejorar, a veces no filtra bien por categoria.","El precio de un producto cambio de un dia para otro sin ninguna explicacion clara. Senti que perdi la oportunidad de una oferta real.","El filtro de precio no se actualiza correctamente al combinarlo con marca.","Las fotos de un producto no coincidian del todo con el color que llego. No es un problema grave pero genera cierta desconfianza para futuras compras.","La seccion de preguntas frecuentes no cubre todos los casos que tuve.","El catalogo de marcas es decente aunque hay ciertos modelos que nunca llegan a tener stock.","El historial de compras no muestra el detalle completo de pedidos antiguos de hace mas de un ano.","Buena variedad de marcas y precios competitivos frente a otras tiendas que revise antes de comprar. El unico punto negativo fue la demora en la confirmacion del pago."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"3_marcas_stock_producto","text":["","","","","","","","","","","",""],"textfont":{"size":12},"x":{"dtype":"f4","bdata":"jBBywPOtfsCM0nLAbTKEwK4pfsA543bA9smDwGd5hcCrEXPAITuAwMXCeMB3NXzA"},"y":{"dtype":"f4","bdata":"qJuQQCfYy0D4mpFAT0q4QAcruECSfIxAt3OzQLnKuUCGraRA8xy\u002fQIxmmkAXZpxA"},"type":"scattergl"},{"hoverinfo":"text","hovertext":["La comparacion de especificaciones tecnicas podria ser mas detallada.","La seccion de resenas de otros clientes me ayudo bastante a decidir que comprar.","El historial de pedidos esta bien organizado, facil de revisar compras anteriores.","Me gusto poder comparar hasta tres productos a la vez antes de decidir. Esa funcion me ahorro bastante tiempo en la busqueda.","Las fotos de los productos son claras y las descripciones bastante completas.","Es facil guardar productos en una lista de deseos para comprarlos despues.","El sitio recuerda mis busquedas anteriores y sugiere productos relacionados de forma acertada.","Seria bueno tener mas filtros de busqueda por presupuesto y marca al mismo tiempo.","Me gusta que se pueda comparar precios entre modelos similares facilmente.","Los filtros de busqueda por precio y marca funcionan muy bien juntos. Encontre rapido lo que necesitaba sin tener que revisar decenas de productos.","El sitio permite comparar hasta tres productos a la vez, muy util para decidir."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"4_productos_comparar_decidir","text":["","","","","","","","","","",""],"textfont":{"size":12},"x":{"dtype":"f4","bdata":"an15wDQ8SsBKHVPAUnRswNhngMABiVPAHqFpwAl8WsCMJmXAWMJVwPKcasA="},"y":{"dtype":"f4","bdata":"aRP3QG7S8ECXuulAT7rqQBiF3EB1\u002fudA4IbtQO8j3kCeOOhARz\u002fhQNpG60A="},"type":"scattergl"},{"hoverinfo":"text","hovertext":["El proceso de facturacion para empresa fue mas simple de lo que esperaba.","Buena seleccion de opciones de pago, use la tarjeta de credito sin ningun problema. El unico detalle fue la demora de un par de minutos en la confirmacion.","El checkout como invitado es rapido si no quieres crear una cuenta.","Las opciones de pago en cuotas varian bastante segun el banco, seria bueno mas claridad.","El proceso de devolucion fue sencillo de iniciar aunque tomo unos dias en confirmarse.","El proceso de pago con tarjeta fue rapido, solo me hubiera gustado mas metodos de pago.","El registro de reclamos deberia enviar actualizaciones automaticas por correo.","El registro de cuenta fue rapido y no me pidieron datos innecesarios.","El registro de cuenta pide demasiados datos para algo tan simple como crear un perfil. Preferiria un proceso mas corto con la opcion de completar el resto despues.","La verificacion de identidad para mi primera compra tomo mas de tres dias habiles. Fue un proceso mas lento de lo que esperaba."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"5_pago_registro_proceso","text":["","","","","","","","","",""],"textfont":{"size":12},"x":{"dtype":"f4","bdata":"p9gXwDCJ+b9oK+q\u002fFJkRwJIFF8BpwADAh5P3v+i57L\u002fq\u002fAXANIIXwA=="},"y":{"dtype":"f4","bdata":"RxhtQHKmeUBLsodA\u002fxmGQCpxbkBBy3lAaY8wQEa7gUBDVllAyu5iQA=="},"type":"scattergl"},{"hoverinfo":"text","hovertext":["Es mi tienda de tecnologia preferida desde hace varios meses, siempre encuentro lo que busco. La atencion al cliente marca una diferencia real frente a otras opciones.","Recomendaria esta tienda a cualquiera que busque tecnologia con buena garantia.","El catalogo de electrodomesticos inteligentes es mas amplio que en otras tiendas que visite.","En general cumple lo que promete, ni mejor ni peor que otras tiendas de tecnologia que he probado.","Muy buena experiencia en general, ya es mi tienda preferida para tecnologia.","Buena tienda en general, seguire comprando aqui mis proximos equipos.","Muy buena experiencia general, el catalogo de electronica es amplio y los precios son justos. Volvere a comprar sin dudarlo para mi proximo equipo."],"marker":{"opacity":0.5,"size":5},"mode":"markers+text","name":"6_tecnologia_tienda_general","text":["","","","","","",""],"textfont":{"size":12},"x":{"dtype":"f4","bdata":"qMxBwCrsPcCkFk3AImw1wFVbP8DeAT7AepdEwA=="},"y":{"dtype":"f4","bdata":"dEUFQbcaCUElawVB8tgGQRHIB0FNggBBDRMIQQ=="},"type":"scattergl"},{"hoverinfo":"text","hovertext":["El diseno del sitio en el celular se ve desordenado en pantallas pequenas, algunos botones quedan superpuestos.","La app movil es muy fluida, mucho mejor que comprar desde el navegador.","La app movil a veces se cierra sola cuando cambio de pantalla muy rapido. Fuera de eso funciona bien para navegar el catalogo.","El sitio carga rapido incluso desde mi celular con datos moviles.","La app funciona correctamente la mayoria del tiempo, con alguna que otra pausa al cargar imagenes.","Las notificaciones push de la app llegan duplicada
